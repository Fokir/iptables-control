version: '3.8'

services:
  # Main application with iptables testing support
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: system-control-test
    ports:
      - "3000:3000"
    environment:
      - BASIC_AUTH_USER=admin
      - BASIC_AUTH_PASSWORD=admin
      - ADD_TEST_RULES=true
      - ADD_SECOND_RULE=false
      - ADD_DISABLED_MATCH_RULE=false
    cap_add:
      - NET_ADMIN
    volumes:
      - ./test-data:/app/test-data:ro
      - db-data:/app/database
    networks:
      - test-network

  # Test scenario 1: Sync detection of existing rules
  test-sync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: system-control-test-sync
    ports:
      - "3001:3000"
    environment:
      - BASIC_AUTH_USER=admin
      - BASIC_AUTH_PASSWORD=admin
      - ADD_TEST_RULES=true
      - ADD_SECOND_RULE=true
      - ADD_DISABLED_MATCH_RULE=false
    cap_add:
      - NET_ADMIN
    volumes:
      - ./test-data:/app/test-data:ro
    networks:
      - test-network
    profiles:
      - test-sync

  # Test scenario 2: Disabled rules in DB matching iptables rules
  test-disabled:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: system-control-test-disabled
    ports:
      - "3002:3000"
    environment:
      - BASIC_AUTH_USER=admin
      - BASIC_AUTH_PASSWORD=admin
      - ADD_TEST_RULES=false
      - ADD_SECOND_RULE=false
      - ADD_DISABLED_MATCH_RULE=true
    cap_add:
      - NET_ADMIN
    volumes:
      - ./test-data:/app/test-data:ro
    networks:
      - test-network
    profiles:
      - test-disabled

volumes:
  db-data:

networks:
  test-network:
    driver: bridge
